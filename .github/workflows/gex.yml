name: GEX update

on:
  schedule:
    - cron: "7 * * * *"      # 毎時7分（UTC）。GitHub 側の混雑で数分〜十数分遅れることがある
  workflow_dispatch:          # Actions 画面から手動実行もできる

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: gex-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: GEX を計算してページを作る
        env:
          GEX_DATA_DIR: data
        run: |
          # 1銘柄の取得失敗でページ更新を止めない（失敗した銘柄は前回の値のまま）
          python gex_levels.py --raw filtered --raw-every 3 || echo "::warning::一部の銘柄の取得に失敗しました"
          python make_page.py

      - name: データをコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "GEX update $(date -u +%Y-%m-%dT%H:%MZ)"
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deploy
        uses: actions/deploy-pages@v4
